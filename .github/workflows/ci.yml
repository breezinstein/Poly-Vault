name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: poly-vault:ci

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE" .

      # One source of truth for every suite: the same script developers run
      # locally (upstream smoke, unit tests, phase 2/3, browser, security,
      # /rig/, link map, models, Save to vault, 3D in headless Chromium).
      - name: All acceptance suites (scripts/ci-local.sh)
        run: PORT=8080 ./scripts/ci-local.sh "$IMAGE"

      - name: Export Unity package from the image + upload artefacts
        run: |
          docker create --name pv-artifacts "$IMAGE"
          docker cp pv-artifacts:/app/plugin/. dist/
          docker rm -f pv-artifacts
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: unity-package
          path: dist/PolyVault-Unity-*

      - name: Cleanup
        if: always()
        run: docker rm -f pv-ci-local pv-verify-3d >/dev/null 2>&1 || true
