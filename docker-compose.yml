services:
  poly-vault:
    build:
      context: .
      args:
        APP_VERSION: "0.4.2-web.1"
    image: poly-vault:0.4.2-web.1
    container_name: poly-vault
    init: true                 # reap zombies; SIGTERM reaches node
    restart: unless-stopped
    read_only: true            # app code is immutable
    tmpfs:
      - /tmp
    # Only reachable from the host loopback: a reverse proxy (Caddy/nginx/
    # Traefik) terminates TLS, does SSO, and forwards to this port.
    ports:
      # Loopback by default: put a TLS proxy in front for team access.
      # Set PV_BIND=0.0.0.0 in .env to expose the port directly (token-only).
      - "${PV_BIND:-127.0.0.1}:8080:8080"
    environment:
      # --- auth -------------------------------------------------------------
      # Either put an authenticating proxy in front (recommended) ...
      PV_TRUST_PROXY_AUTH: "0"
      # ... or set a shared team token (browser shows a login form):
      PV_TOKEN: "${PV_TOKEN:?set PV_TOKEN in .env or use a proxy}"
      # Optional per-artist tokens "alice:tok-a,bob:tok-b". Gives each person an
      # identity so "Import to Unity" only shows up in *their* editor.
      PV_USERS: "${PV_USERS:-}"
      # Required for add/remove library endpoints when not using proxy groups.
      PV_ADMIN_TOKEN: "${PV_ADMIN_TOKEN:-}"
      # Set when behind a reverse proxy on a different public hostname, so the
      # same-origin check accepts your users' Origin header.
      PV_PUBLIC_ORIGIN: "${PV_PUBLIC_ORIGIN:-}"
      # --- libraries --------------------------------------------------------
      # Colon-separated roots; each one shows up as a library in the UI
      # (its display name is the folder name).
      PV_LIBRARIES: "${PV_LIBRARIES:-/assets}"
      PV_LIBRARY_ROOTS: "${PV_LIBRARY_ROOTS:-/assets:/libraries}"
      # --- scanning / enrichment -------------------------------------------
      # Max age of a cached scan. fs.watch handles local changes immediately on
      # a local disk; inotify does NOT report changes made by other machines on
      # NFS, so on the NAS this is what picks up new packages. 5 min keeps the
      # NAS quiet while still showing new downloads promptly.
      PV_SCAN_MAX_AGE_MS: "300000"
      # Mutating requests per identity per minute (0 disables).
      PV_RATE_LIMIT_PER_MIN: "240"
      # Disposable WebP cache for the grid (safe to delete).
      PV_THUMB_CACHE_MAX_FILES: "20000"
      # Read .unitypackage archives for real thumbnails + "what's inside".
      # Set to "0" to skip entirely (no NAS read traffic from indexing).
      PV_PACKAGE_INDEX: "${PV_PACKAGE_INDEX:-1}"
      # Package index: reads Unity's own previews + contents out of each
      # .unitypackage. The full pass (accurate contents) only runs for packages
      # up to this size; bigger ones keep the preview + partial counts.
      PV_PACKAGE_INDEX_MAX_MB: "4096"
      # Browser "Download" and Unity HTTP import: per-archive cap + parallel zips.
      PV_DOWNLOAD_MAX_BYTES: "2147483648"
      PV_ZIP_CONCURRENCY: "2"
      # Asset Store description scraping is outbound internet traffic; turn it
      # off on air-gapped hosts and on libraries that are already tagged.
      ASSETVAULT_NO_ENRICH: "0"
      # Only auto-describe the Asset Store cache: its folder names are real
      # product names. Hand-curated folders ("Meshes", "Models") otherwise match
      # random store products and get misleading descriptions.
      PV_ENRICH_ROOTS: "${PV_ENRICH_ROOTS:-/assets}"
    volumes:
      # Metadata only (tags, descriptions, library list, import jobs).
      # A named volume is created with the right ownership (uid 10001) for you;
      # a bind mount like ./data:/data needs `chown -R 10001:10001 ./data`.
      - poly_vault_data:/data
      # Asset libraries, mounted read-only (Poly Vault never writes to them).
      # Every mounted root must also appear in PV_LIBRARIES, and inside
      # PV_LIBRARY_ROOTS if you want to add libraries from the UI.
      - "${PV_ASSETS:-/srv/assets}:/assets:ro"
      # A second library, e.g. a hand-curated folder next to the store cache:
      # - "${PV_ASSETS_2:-/srv/assets-2}:/libraries/Second Library:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # The scan is single-process and CPU-bound; one worker is the
          # correct shape. Size for peak library size, not for concurrency.
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional: TLS + basic auth in one container. Uncomment and set the token
  # hash with: docker run --rm caddy caddy hash-password --plaintext 's3cret'
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - poly-vault

volumes:
  poly_vault_data:

  # Optional: mount the library straight from an NFS export (e.g. the Unity
  # Asset Store cache on a NAS). Uncomment, set PV_NFS_ADDR / PV_NFS_EXPORT in
  # .env, and point the service mount at it (`nas_unity_assets:/assets:ro`).
  #
  #   o= options
  #     nolock        no rpc.statd/lockd needed; the mount is read-only
  #     soft          a dead NAS returns EIO instead of hanging the container
  #     ro            defence in depth: the volume itself cannot be written
  #     actimeo=60    cache NFS attributes; the scanner stats every file, and
  #                   without this each stat is a network round trip
  #   device: ':<export path>'   (note the leading colon)
  #
  # nas_unity_assets:
  #   driver_opts:
  #     type: nfs
  #     o: "addr=${PV_NFS_ADDR:?set PV_NFS_ADDR},nolock,soft,ro,actimeo=60"
  #     device: ":${PV_NFS_EXPORT:?set PV_NFS_EXPORT}"

# Uncomment when using the optional Caddy service above.
#   caddy_data:
#   caddy_config:
